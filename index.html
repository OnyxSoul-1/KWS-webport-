<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>KeyboardWarriorStickman - Ported by Onyx$oul-1</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        .credit { position: absolute; bottom: 15px; right: 15px; color: rgba(255,255,255,0.4); font-family: monospace; font-size: 14px; font-weight: bold; z-index: 9999; pointer-events: none; }
    </style>

    <!-- THE MERGER SCRIPT WITH FAKE HEADERS -->
    <script>
        const CDN_URL = "https://raw.githack.com/OnyxSoul-1/KWS-webport-/main/Build/";
        
        const originalFetch = window.fetch;
        window.fetch = async function(url, options) {
            const urlStr = url.toString();
            
            // FAKE HEADERS TO BYPASS CORS/PERMISSIONS
            const fakeHeaders = {
                'Access-Control-Allow-Origin': '*',
                'Access-Control-Allow-Methods': 'GET, POST, OPTIONS',
                'Permissions-Policy': 'interest-cohort=()',
                'Cross-Origin-Resource-Policy': 'cross-origin'
            };

            async function fetchAndMerge(basePath, numParts) {
                let parts = [];
                for (let i = 1; i <= numParts; i++) {
                    // Inject fake headers into the request
                    let res = await originalFetch(`${basePath}.part${i}`, {
                        mode: 'cors',
                        headers: fakeHeaders
                    });
                    if (!res.ok) throw new Error(`Missing part ${i} for ${basePath}`);
                    parts.push(await res.arrayBuffer());
                }
                const totalLength = parts.reduce((acc, val) => acc + val.byteLength, 0);
                const merged = new Uint8Array(totalLength);
                let offset = 0;
                for (const part of parts) {
                    merged.set(new Uint8Array(part), offset);
                    offset += part.byteLength;
                }
                return merged;
            }

            // Merge Data
            if (urlStr.includes('Webgl%20v0012.data.gz') || urlStr.includes('Webgl v0012.data.gz')) {
                try {
                    const merged = await fetchAndMerge(CDN_URL + 'Webgl%20v0012.data.gz', 2);
                    return new Response(merged, { status: 200, headers: new Headers(fakeHeaders) });
                } catch (e) { console.error(e); return originalFetch(url, options); }
            }
            
            // Merge WASM
            if (urlStr.includes('Webgl%20v0012.wasm.gz') || urlStr.includes('Webgl v0012.wasm.gz')) {
                try {
                    const merged = await fetchAndMerge(CDN_URL + 'Webgl%20v0012.wasm.gz', 2);
                    return new Response(merged, { status: 200, headers: new Headers({ ...fakeHeaders, 'Content-Type': 'application/wasm' }) });
                } catch (e) { console.error(e); return originalFetch(url, options); }
            }
            
            return originalFetch(url, options);
        };
    </script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">KeyboardWarriorStickman</div>
      </div>
    </div>

    <div class="credit">Ported by Onyx$oul-1</div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = CDN_URL;
      var loaderUrl = buildUrl + "Webgl%20v0012.loader.js";
      
      var config = {
        dataUrl: buildUrl + "Webgl%20v0012.data.gz",
        frameworkUrl: buildUrl + "Webgl%20v0012.framework.js.gz",
        codeUrl: buildUrl + "Webgl%20v0012.wasm.gz",
        streamingAssetsUrl: CDN_URL + "StreamingAssets",
        companyName: "GoodKnightCollective",
        productName: "KeyboardWarriorStickman",
        productVersion: "0.001",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
