<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KWS - Ported by Onyx$oul-1</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>

    <script>
        const originalFetch = window.fetch;
        window.fetch = async function(url, options) {
            const urlStr = url.toString();
            
            async function mergeParts(baseName) {
                let parts = [];
                for (let i = 1; i <= 2; i++) {
                    let res = await originalFetch(`./Build/${baseName}.part${i}`);
                    if (!res.ok) throw new Error("Missing part " + i);
                    parts.push(await res.arrayBuffer());
                }
                const merged = new Uint8Array(parts.reduce((acc, val) => acc + val.byteLength, 0));
                let offset = 0;
                for (const part of parts) {
                    merged.set(new Uint8Array(part), offset);
                    offset += part.byteLength;
                }
                return merged;
            }

            if (urlStr.includes('Webgl.data.gz')) {
                try {
                    const merged = await mergeParts('Webgl.data.gz');
                    return new Response(merged, { status: 200 });
                } catch (e) { return originalFetch(url, options); }
            }
            
            if (urlStr.includes('Webgl.wasm.gz')) {
                try {
                    const merged = await mergeParts('Webgl.wasm.gz');
                    return new Response(merged, { status: 200, headers: new Headers({ 'Content-Type': 'application/wasm' }) });
                } catch (e) { return originalFetch(url, options); }
            }
            
            return originalFetch(url, options);
        };
    </script>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
        </div>
        <div id="unity-warning"></div>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        function unityShowBanner(msg, type) {
            var warningBanner = document.querySelector("#unity-warning");
            warningBanner.style.display = 'block';
            warningBanner.innerHTML = msg;
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Webgl.loader.js";
        
        var config = {
            dataUrl: buildUrl + "/Webgl.data.gz",
            frameworkUrl: buildUrl + "/Webgl.framework.js.gz",
            codeUrl: buildUrl + "/Webgl.wasm.gz",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "GoodKnightCollective",
            productName: "KeyboardWarriorStickman",
            productVersion: "0.001",
            showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
